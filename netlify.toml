# Le connecteur IA (MCP) servi depuis notre domaine, relayé vers la fonction
# Supabase. Pourquoi : à la connexion, Claude interroge des adresses de
# découverte OAuth ; sous le domaine Supabase, l'une d'elles
# (/.well-known/oauth-protected-resource/functions/v1/mcp/…) répond 401,
# géré par Supabase et pas par nous. Depuis le 19/10/2026 (OAuth, pour
# l'annuaire des connecteurs Claude), ces adresses de découverte répondent
# pour de vrai, relayées vers la fonction `oauth`. L'ordre compte : la
# première règle qui correspond gagne.
[[redirects]]
  from = "/mcp"
  to = "https://ihigmlpgliasczlvxttd.supabase.co/functions/v1/mcp"
  status = 200
  force = true
[[redirects]]
  from = "/.well-known/oauth-authorization-server"
  to = "https://ihigmlpgliasczlvxttd.supabase.co/functions/v1/oauth/meta-serveur"
  status = 200
  force = true
[[redirects]]
  from = "/.well-known/oauth-authorization-server/*"
  to = "https://ihigmlpgliasczlvxttd.supabase.co/functions/v1/oauth/meta-serveur"
  status = 200
  force = true
[[redirects]]
  from = "/.well-known/oauth-protected-resource"
  to = "https://ihigmlpgliasczlvxttd.supabase.co/functions/v1/oauth/meta-ressource"
  status = 200
  force = true
[[redirects]]
  from = "/.well-known/oauth-protected-resource/*"
  to = "https://ihigmlpgliasczlvxttd.supabase.co/functions/v1/oauth/meta-ressource"
  status = 200
  force = true
[[redirects]]
  from = "/oauth/*"
  to = "https://ihigmlpgliasczlvxttd.supabase.co/functions/v1/oauth/:splat"
  status = 200
  force = true
[[redirects]]
  from = "/mcp/*"
  to = "https://ihigmlpgliasczlvxttd.supabase.co/functions/v1/mcp/:splat"
  status = 200
  force = true
