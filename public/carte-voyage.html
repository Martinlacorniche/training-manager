<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>Mon voyage</title>
<!--
  La carte de « Mon voyage » : un globe clair (MapLibre GL, tuiles OpenFreeMap),
  le chemin de l'année qui se dessine, les étapes, et un point qui pulse là où
  en est l'athlète. Une seule page pour l'app (WebView) et le site (iframe) :
  les données arrivent dans le fragment d'URL (#…, JSON), rien ne part au
  serveur. Géométrie calculée par la fonction voyage (App-Coach).
-->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/maplibre-gl@5.24.0/dist/maplibre-gl.css" />
<script src="https://cdn.jsdelivr.net/npm/maplibre-gl@5.24.0/dist/maplibre-gl.js"></script>
<style>
  html, body, #carte { margin: 0; height: 100%; background: #eef2f7; overflow: hidden; }
  .point { width: 16px; height: 16px; border-radius: 50%; background: #0d9488; box-shadow: 0 0 0 0 rgba(13,148,136,.6); animation: pouls 1.8s infinite; border: 2px solid #fff; }
  @keyframes pouls { 0% { box-shadow: 0 0 0 0 rgba(13,148,136,.6); } 70% { box-shadow: 0 0 0 18px rgba(13,148,136,0); } 100% { box-shadow: 0 0 0 0 rgba(13,148,136,0); } }
  .maison { width: 10px; height: 10px; border-radius: 50%; background: #fff; border: 3px solid #0d9488; }
  .drapeau { font: 700 11px/1 -apple-system, "Segoe UI", Roboto, sans-serif; color: #0f172a; background: #fff; padding: 5px 8px; border-radius: 8px; box-shadow: 0 2px 8px rgba(15,23,42,.15); white-space: nowrap; transform: translateY(-22px); }
  .maplibregl-ctrl-attrib { font-size: 9px; background: rgba(255,255,255,.7) !important; color: #64748b; }
  .maplibregl-ctrl-attrib a { color: #94a3b8; }
  .maplibregl-ctrl-attrib.maplibregl-compact:not(:hover) .maplibregl-ctrl-attrib-inner { display: none; }
</style>
</head>
<body>
<div id="carte"></div>
<script>
  let d = null;
  try { d = JSON.parse(decodeURIComponent(location.hash.slice(1))); } catch (e) {}
  if (d) {
    const tous = [...d.trace, ...d.a_venir, d.maison, d.cap];
    const lng = tous.map((p) => p[0]), lat = tous.map((p) => p[1]);
    const map = new maplibregl.Map({
      container: "carte",
      style: "https://tiles.openfreemap.org/styles/positron",
      bounds: [[Math.min(...lng), Math.min(...lat)], [Math.max(...lng), Math.max(...lat)]],
      fitBoundsOptions: { padding: { top: 50, bottom: 40, left: 40, right: 40 }, maxZoom: 6 },
      interactive: false,
      attributionControl: { compact: true },
    });
    const ligne = (c) => ({ type: "Feature", geometry: { type: "LineString", coordinates: c.length > 1 ? c : [c[0], c[0]] } });
    const drapeau = (txt, p, cls) => {
      const el = document.createElement("div"); el.className = cls; if (txt) el.textContent = txt;
      new maplibregl.Marker({ element: el, anchor: cls === "drapeau" ? "bottom" : "center" }).setLngLat(p).addTo(map);
    };

    map.on("style.load", () => {
      try { map.setProjection({ type: "globe" }); } catch (e) {}
      // Les noms de la carte en français quand ils existent.
      for (const l of map.getStyle().layers) {
        if (l.type === "symbol" && map.getLayoutProperty(l.id, "text-field")) {
          map.setLayoutProperty(l.id, "text-field", ["coalesce", ["get", "name:fr"], ["get", "name"]]);
        }
      }
      // Les sources, repliées derrière le petit « i ».
      document.querySelectorAll(".maplibregl-ctrl-attrib").forEach((x) => x.classList.remove("maplibregl-compact-show"));
      map.addSource("trace", { type: "geojson", data: ligne([d.trace[0]]) });
      map.addSource("avenir", { type: "geojson", data: ligne(d.a_venir.length ? d.a_venir : [d.cap]) });
      map.addSource("etapes", { type: "geojson", data: { type: "FeatureCollection", features: d.etapes.map((e) => ({ type: "Feature", properties: { passee: e.passee }, geometry: { type: "Point", coordinates: [e.lng, e.lat] } })) } });
      map.addLayer({ id: "avenir", type: "line", source: "avenir", paint: { "line-color": "#64748b", "line-width": 2, "line-opacity": 0.7, "line-dasharray": [1, 2] } });
      map.addLayer({ id: "halo", type: "line", source: "trace", layout: { "line-cap": "round", "line-join": "round" }, paint: { "line-color": "#2dd4bf", "line-width": 12, "line-blur": 8, "line-opacity": 0.35 } });
      map.addLayer({ id: "trace", type: "line", source: "trace", layout: { "line-cap": "round", "line-join": "round" }, paint: { "line-color": "#0d9488", "line-width": 4 } });
      map.addLayer({ id: "etapes", type: "circle", source: "etapes", paint: {
        "circle-radius": 4.5, "circle-color": ["case", ["get", "passee"], "#0d9488", "#ffffff"],
        "circle-stroke-color": ["case", ["get", "passee"], "#ffffff", "#94a3b8"], "circle-stroke-width": 2 } });

      drapeau(null, d.maison, "maison");
      drapeau(d.noms.maison, d.maison, "drapeau");
      for (const x of d.destinations) drapeau(x.nom, [x.lng, x.lat], "drapeau");
      drapeau(d.noms.cap, d.cap, "drapeau");

      // Le chemin se dessine, puis le point se met à pulser.
      const t0 = performance.now(), duree = 1800;
      const anime = (t) => {
        const k = Math.min(1, (t - t0) / duree), e = 1 - Math.pow(1 - k, 3);
        const n = Math.max(1, Math.round(e * (d.trace.length - 1)) + 1);
        map.getSource("trace").setData(ligne(d.trace.slice(0, n)));
        if (k < 1) requestAnimationFrame(anime);
        else drapeau(null, d.position, "point");
      };
      requestAnimationFrame(anime);
    });
  }
</script>
</body>
</html>
